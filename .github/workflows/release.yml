# Builds the app on a version tag (v1.2.3) and publishes it as a GitHub
# Release: a .zip and a .dmg for Apple Silicon and for Intel Macs, an AppImage
# and a .deb for x64 and arm64 Linux, the Guide for the web as one archive,
# and one SHA256SUMS for all of them, which install.sh checks. Names come from src/shared/brand.ts; the notes are
# the tag's section of CHANGELOG.md.
#
# Nothing runs until a tag is pushed:  git tag v0.1.0 && git push origin v0.1.0
#
# The organization's default token can only read, so every job says what its
# token may do: the builds read, and only the release job writes (spec §15.4).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: ./.github/actions/electron-cache

      # npm ci downloads Electron in its install script.
      - name: Install
        run: scripts/retry.sh 3 30 npm ci

      - name: Use the tag as the app's version
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Check
        run: npm run check

      # electron-builder downloads Electron for the other architecture and
      # its own tools.
      - name: Build and package (arm64 and x64)
        run: |
          npm run build
          scripts/retry.sh 3 30 npx tsx --tsconfig tsconfig.node.json scripts/package.ts --platform mac --arch all

      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            dist/*-mac-*.zip
            dist/*-mac-*.dmg
          if-no-files-found: error

  # node-pty is compiled for the machine it's built on, so each architecture
  # builds on its own runner, in Debian 11 for an old enough glibc (spec §15.6).
  linux:
    strategy:
      # Each architecture's result counts on its own: one failing doesn't cancel the other.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The build runs in Docker; scripts/linux-package.sh hands this folder
      # to it and takes the downloads back out.
      - uses: ./.github/actions/electron-cache
        with:
          path: ${{ runner.temp }}/downloads

      - name: Build the AppImage and .deb
        run: VERSION="${GITHUB_REF_NAME#v}" DOWNLOADS="$RUNNER_TEMP/downloads" RETRIES=3 scripts/linux-package.sh

      # Ubuntu 24.04 lets only programs with an AppArmor profile use user
      # namespaces, which Chromium's sandbox needs, and the check's container
      # shares this runner's kernel. Set the runner up as a user does after
      # install.sh's notes, and prove the profile works (spec §15.4).
      - name: Follow install.sh's AppArmor notes, as a user does
        timeout-minutes: 10
        run: scripts/linux-package-check-host.sh

      - name: Try them on Ubuntu 24.04 (install.sh, self-test, sandbox, .deb)
        timeout-minutes: 30
        run: SKIP_BUILD=1 scripts/linux-package-check.sh

      # The .deb as a user gets it: on the runner itself, where its
      # after-install script can load its AppArmor profile (a container can't).
      - name: Try the .deb on the runner (apt, self-test with the sandbox, remove)
        timeout-minutes: 15
        run: scripts/linux-package-check-deb.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*-linux-*.AppImage
            dist/*-linux-*.deb
          if-no-files-found: error

  # The Guide as plain Markdown with index.json and its screenshots, in
  # <displayName>-guide.tar.gz (spec §6.12). It needs no Electron, so nothing
  # runs at install.
  guide:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (without install scripts)
        run: npm ci --ignore-scripts

      - name: Use the tag as the Guide's version
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Export the Guide
        run: npm run guide:export -- --archive

      - uses: actions/upload-artifact@v7
        with:
          name: guide
          path: dist/*-guide.tar.gz
          if-no-files-found: error

  release:
    needs: [macos, linux, guide]
    runs-on: ubuntu-24.04
    # gh release create needs to write the repository's releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The tag's section of CHANGELOG.md; the release fails without one.
      - name: Release notes
        run: node scripts/changelog-notes.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            assets/*

      # The landing page reads the latest version when it's built. The release
      # is out by now, so a failing hook only warns (spec §15.4).
      - name: Rebuild the landing page
        env:
          HOOK: ${{ secrets.LANDING_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "No LANDING_DEPLOY_HOOK secret: skipped"; exit 0; fi
          if ! curl -fsS --max-time 30 -X POST "$HOOK" > /dev/null; then
            echo "::warning::The landing page's deploy hook failed; the release is published, rebuild the page by hand"
          fi
