# Checks every pull request and every push to main: lint, typecheck, unit
# tests and the name and notices checks on Linux and macOS, and the e2e tests
# on Linux under xvfb with a fake claude (never the real one). No secrets; the
# token can only read the repository. A newer push cancels the run it replaces.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # The unit tests check each login shell and the launcher badge's D-Bus
      # signal where they are installed, as in scripts/linux-check.sh.
      - name: Shells and D-Bus (Linux)
        if: runner.os == 'Linux'
        run: scripts/apt-install.sh zsh fish dbus

      - uses: ./.github/actions/electron-cache

      # npm ci downloads Electron in its install script.
      - name: Install
        run: scripts/retry.sh 3 30 npm ci

      - name: Check
        run: npm run check

  # Every e2e suite in scripts/e2e-suites.json, as scripts/linux-check.sh
  # runs them, with Chromium's sandbox on: the production build and the dev
  # server in two jobs side by side. Ubuntu 24.04 keeps unprivileged user
  # namespaces from programs without an AppArmor profile, which Electron in
  # node_modules is; the runner lifts that restriction for the job.
  e2e-linux:
    name: e2e (linux, ${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [prod, dev]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: System packages
        run: |
          scripts/apt-install.sh xvfb xauth zsh fish dbus \
            libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxshmfence1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: ./.github/actions/electron-cache

      # npm ci downloads Electron in its install script.
      - name: Install
        run: scripts/retry.sh 3 30 npm ci

      - name: Build
        run: npm run build

      - name: Self-test
        run: xvfb-run -a npx electron . --self-test

      - name: e2e
        run: npx tsx --tsconfig tsconfig.node.json scripts/e2e.ts --xvfb --mode ${{ matrix.mode }}
